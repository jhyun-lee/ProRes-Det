# Restoration model defaults.
#
# `ablation` mirrors RestorationConfig. Leaving every flag true reproduces the
# reference architecture exactly, which is what the shipped weights were trained as.
# CLI flags (--no-ca, --base-dim, ...) override anything set here.

model:
  # Which restoration backend runs. Any name registered with @register_restorer;
  # --restorer overrides it. Swapping this is the whole change - the pipeline,
  # recording and evaluation code never learn which backend they are talking to.
  backend: naf_se_unet
  weights: weights/restorer_nafse_unet.pt
  # Network input, (width, height). Fully convolutional, so this can differ from the
  # 320x180 training patch without retraining.
  input_size: [640, 360]

ablation:
  # NAFSEBlock internals
  use_prenorm: true
  use_naf_norm: true
  use_simple_gate: true
  use_naf_scale: true
  use_ca: true
  # U-Net skeleton
  use_skip1: true
  use_skip2: true
  use_skip3: true
  use_bottleneck: true
  use_tanh: true
  # capacity
  base_dim: 48
  enc_depth: [2, 2, 3]
  dec_depth: [2, 2, 2]
  bottleneck_depth: 2
  dw_expand: 2
  ffn_expand: 2
  ca_reduction: 16
  # in_ch (6 = cat([distorted, light])) and out_ch (3 = residual) are fixed by the
  # pipeline, so they are not listed here - overriding them only produces a network
  # no checkpoint fits.

train:
  # Where the training set lives. Each entry takes a directory, a glob, or a list -
  # real sets come date-partitioned and the light frames sit apart from the rest.
  #
  # These three are globbed as written, so a relative path is read against the
  # working directory, not the project root. Run train.py from the repo root, or
  # give absolute paths. Clearing all three (null) falls back to --data-root.
  #
  # This is the training split only. sample_eval and sample_test are held out for
  # evaluate.py; pointing this at either would score the model on what it fitted.
  data:
    distorted: "data/SampleData/sample_train/distorted"
    surface: "data/SampleData/sample_train/surface"
    light: "data/SampleData/sample_train/light"

  epochs: 30
  batch_size: 4
  accum_steps: 4
  lr: 0.0002
  patch_size: [180, 320]      # (height, width) random crop
  resize_to: [360, 640]       # (height, width) before cropping
  # Loss weights from the Optuna sweep on this dataset.
  loss:
    l1: 0.9262
    perceptual: 2.0369
    ssim: 0.5319
    wavelet: 0.8977
