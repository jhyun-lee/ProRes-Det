# Detection settings. This file is the only place they are set - no CLI flag
# overrides any of it.
#
# `backend` picks which wrapper runs; `weights` per backend is resolved relative to
# the project root.

detector:
  # yolo | ssd | none, or anything registered with @register_detector.
  #
  # A list scores one row per backend in evaluate.py's report:
  #     backend: [yolo, ssd]
  # Each entry loads its own weights entry below. demo.py detects with one model, so
  # it takes the first name in the list.
  #
  # The default is `ssd` for a licensing reason, not a quality one. ssd is
  # torchvision's SSDLite320-MobileNetV3-Large (BSD-3-Clause), so an out-of-the-box
  # run touches nothing but MIT/BSD/Apache code. `yolo` is Ultralytics YOLO11, and
  # both the package and the checkpoint here are AGPL-3.0 - selecting it is opting
  # into that licence for whatever you build. See THIRD_PARTY.md.
  #
  # With the current NAFSE-UNet checkpoint on the 1,000-pair sample_test,
  # restoration gains +0.2202 mAP@0.5 for SSD and +0.1793 for YOLO11.
  # Both rows are in the README's reference table.
  backend: ssd
  conf: 0.25
  imgsz: null             # YOLO inference size; null keeps the checkpoint's own
  # Box filter applied to both the captured and the restored pass.
  min_width: 20
  min_height: 20
  min_area: 500

weights:
  yolo: weights/detector_yolo11s.pt
  ssd: weights/detector_ssdlite.pth

# 17 classes, ids 0..16. YOLO checkpoints carry their own names and those win over this
# list; torchvision (ssd) has none, so this list is what it uses.
names:
  - Apple        # 0
  - BlueBerry    # 1
  - GreenApple   # 2
  - Kiwi         # 3
  - Lemon        # 4
  - Melon        # 5
  - Orange       # 6
  - Peach        # 7
  - Pear         # 8
  - Punica       # 9
  - Watermelon   # 10
  - Cat          # 11
  - Elephant     # 12
  - Giraffe      # 13
  - Monkey       # 14
  - Shark        # 15
  - Snake        # 16
