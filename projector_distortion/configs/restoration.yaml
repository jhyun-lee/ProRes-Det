# Restoration model defaults.
#
# `ablation` mirrors RestorationConfig. Leaving every flag true reproduces the
# reference architecture exactly, which is what the shipped weights were trained as.
# This file is the only place the architecture is configured - there is no CLI flag
# per field, because a checkpoint carries the config it was trained with and
# inference rebuilds from that. Edit here, then `python train.py`.

model:
  # Which restoration backend runs. Any name registered with @register_restorer.
  # Swapping this is the whole change - the pipeline, recording and evaluation code
  # never learn which backend they are talking to.
  backend: naf_se_unet
  weights: weights/restorer_nafse_unet.pt
  # Network input, (width, height). Fully convolutional, so this can differ from the
  # 320x180 training patch without retraining. Smaller is faster and costs
  # restoration quality, not detection, down to about 480x270.
  input_size: [640, 360]

# Turning one of these off and retraining measures that component's contribution.
# The run directory and the checkpoint filename get a tag naming what was ablated
# (e.g. `NoCA-NoSkip3`), so a variant stays identifiable from its path alone.
ablation:
  # NAFSEBlock internals
  use_prenorm: true         # false: drop the pre-LayerNorm of NAFSEBlock
  use_naf_norm: true        # false: drop LayerNorm2d inside NAFBlock
  use_simple_gate: true     # false: GELU instead of SimpleGate (no channel halving)
  use_naf_scale: true       # false: drop the learnable residual scales beta / gamma
  use_ca: true              # false: no channel attention; a plain NAFBlock
  # U-Net skeleton
  use_skip1: true           # false: no skip enc1 -> dec1 (full resolution)
  use_skip2: true           # false: no skip enc2 -> dec2 (1/2 resolution)
  use_skip3: true           # false: no skip enc3 -> dec3 (1/4 resolution)
  use_bottleneck: true      # false: the 1/8-resolution bottleneck becomes Identity
  use_tanh: true            # false: no output tanh (unbounded residual)
  # capacity
  base_dim: 48
  enc_depth: [2, 2, 3]      # exactly 3 levels
  dec_depth: [2, 2, 2]      # exactly 3 levels
  bottleneck_depth: 2
  dw_expand: 2
  ffn_expand: 2
  ca_reduction: 16
  # in_ch (6 = cat([distorted, light])) and out_ch (3 = residual) are fixed by the
  # pipeline, so they are not listed here - overriding them only produces a network
  # no checkpoint fits.

train:
  # Where the training set lives. Each entry takes a directory, a glob, or a list -
  # real sets come date-partitioned and the light frames sit apart from the rest.
  #
  # These three are globbed as written, so a relative path is read against the
  # working directory, not the project root. Run train.py from the repo root, or
  # give absolute paths. Clearing all three (null) falls back to --data-root.
  #
  # This is the training split only. sample_eval and sample_test are held out for
  # evaluate.py; pointing this at either would score the model on what it fitted.
  data:
    distorted: "data/SampleData/sample_train/distorted"
    surface: "data/SampleData/sample_train/surface"
    light: "data/SampleData/sample_train/light"

  epochs: 30
  batch_size: 4
  accum_steps: 4
  lr: 0.0002
  patch_size: [180, 320]      # (height, width) random crop
  resize_to: [360, 640]       # (height, width) before cropping
  # Loss weights from the Optuna sweep on this dataset.
  loss:
    l1: 0.9262
    perceptual: 2.0369
    ssim: 0.5319
    wavelet: 0.8977
